<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prenota lavatrice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topnav">
        <a class="brand" href="index.html"
          >Lavatrice di casa
          <span>calendario condiviso · 1 stendino</span>
        </a>
        <nav class="nav-links">
          <a href="index.html">Settimana</a>
          <a class="active" href="prenota.html">Prenota</a>
        </nav>
      </header>

      <p class="hero-line">
        Scegli chi sei, quando parti e il tipo di lavaggio. Il sistema aggiunge
        da solo appendere + ore di asciugatura sullo stendino unico.
      </p>

      <section class="panel">
        <form id="booking-form" class="form-grid" novalidate>
          <div class="form-grid two">
            <label>
              Il tuo nome
              <input
                type="text"
                name="name"
                id="name"
                required
                maxlength="40"
                placeholder="es. Marco"
                autocomplete="name"
              />
            </label>
            <label>
              Giorno
              <input type="date" name="date" id="date" required />
            </label>
          </div>

          <div class="form-grid two">
            <label>
              Ora di inizio
              <input type="time" name="time" id="time" required step="1800" />
            </label>
            <label>
              Anteprima slot
              <input type="text" id="preview" readonly value="Scegli un lavaggio…" />
            </label>
          </div>

          <fieldset style="border: 0; margin: 0; padding: 0">
            <legend style="font-weight: 600; font-size: 0.88rem; margin-bottom: 0.5rem">
              Tipo di lavaggio
            </legend>
            <div class="wash-options" id="wash-options"></div>
          </fieldset>

          <div class="form-actions">
            <button type="submit" class="primary">Prenota lavatrice</button>
            <a class="btn" href="index.html">Vedi settimana</a>
          </div>

          <div class="feedback" id="feedback" role="status"></div>
        </form>
      </section>
    </div>
    <script type="module" src="js/prenota.js"></script>
  </body>
</html>
